[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-data-platform"
version = "0.1.0"
description = "International finance data discovery and ingestion platform"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31,<3",
  "pandas>=2.1,<4",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

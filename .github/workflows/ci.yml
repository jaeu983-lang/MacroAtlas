name: MacroAtlas tests

on:
  push:
    branches:
      - codex/iteration-04-gate-a
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: python -m pip install -e ".[dev]"
      - name: Validate isolated updater planning entrypoint on Windows
        if: runner.os == 'Windows'
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          if ($env:EVENT_NAME -eq "pull_request") {
              $Base = $env:PR_BASE_SHA
          } else {
              $Base = (git rev-parse "${env:CANDIDATE_SHA}^").Trim()
          }
          $PythonPath = (Get-Command python).Source
          & .\scripts\run_improvement.ps1 -PythonPath $PythonPath -BaseRef $Base -DryRun
      - name: Validate scheduled-task installer dry-run on Windows
        if: runner.os == 'Windows'
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          if ($env:EVENT_NAME -eq "pull_request") {
              $Base = $env:PR_BASE_SHA
          } else {
              $Base = (git rev-parse "${env:CANDIDATE_SHA}^").Trim()
          }
          $BaseBranch = "codex-updater-installer-ci-base"
          git branch --force $BaseBranch $Base
          if ($LASTEXITCODE -ne 0) { throw "Could not create installer test base branch." }
          $PythonPath = (Get-Command python).Source
          $PlanText = & .\scripts\install_tasks.ps1 -BaseRef $BaseBranch -PythonPath $PythonPath -DryRun
          if ($LASTEXITCODE -ne 0) { throw "Scheduled-task installer dry-run failed." }
          $Plan = $PlanText | ConvertFrom-Json
          if ($Plan.status -ne "DRY_RUN" -or $Plan.registered -ne $false) {
              throw "Installer dry-run did not return an unregistered plan."
          }
      - name: Validate isolated updater planning entrypoint on Linux
        if: runner.os != 'Windows'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$(git rev-parse "${CANDIDATE_SHA}^")"
          fi
          python scripts/run_improvement.py --base-ref "$BASE_SHA" --dry-run
      - name: Run shared maintenance checks through Windows wrapper
        if: runner.os == 'Windows'
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          $PythonPath = (Get-Command python).Source
          if ($env:EVENT_NAME -eq "pull_request") {
              $Base = $env:PR_BASE_SHA
          } else {
              $Base = (git rev-parse "${env:CANDIDATE_SHA}^").Trim()
          }
          & .\scripts\run_checks.ps1 -PythonPath $PythonPath -Base $Base -Candidate $env:CANDIDATE_SHA
      - name: Run shared maintenance checks on Linux
        if: runner.os != 'Windows'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$(git rev-parse "${CANDIDATE_SHA}^")"
          fi
          python scripts/run_maintenance_qa.py --project-root . --base "$BASE_SHA" --candidate "$CANDIDATE_SHA"
      - name: Upload maintenance QA report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-qa-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/maintenance_qa_*/
          if-no-files-found: warn

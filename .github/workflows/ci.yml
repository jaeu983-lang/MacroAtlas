name: MacroAtlas tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: python -m pip install -e ".[dev]"
      - name: Run shared maintenance checks through Windows wrapper
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $PythonPath = (Get-Command python).Source
          & .\scripts\run_checks.ps1 -PythonPath $PythonPath
      - name: Run shared maintenance checks on Linux
        if: runner.os != 'Windows'
        run: python scripts/run_maintenance_qa.py
      - name: Upload maintenance QA report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-qa-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/maintenance_qa_*/
          if-no-files-found: warn
